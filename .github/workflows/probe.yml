name: Exploration API vagues

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modèles, grilles et paquets disponibles
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: |
          pip install -q netCDF4 cfgrib eccodes xarray
          python scripts/probe_waves2.py

name: Exploration API vagues

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modèles, grilles et paquets disponibles
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: |
          pip install -q netCDF4 scipy numpy
          mkdir -p /tmp/out
          python scripts/fetch_ww3.py /tmp/out
          ls -la /tmp/out
          gzip -k /tmp/out/ww3.json && ls -la /tmp/out/ww3.json.gz
          python -c "import json;d=json.load(open('/tmp/out/ww3_spots.json'));print({k:(v['dist_km'],v['hs'][:6],v.get('tp',[None])[:3]) for k,v in d['spots'].items()})"

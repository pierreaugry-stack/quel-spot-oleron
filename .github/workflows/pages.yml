name: Mesures et publication

# Toutes les 30 min : récupère les bouées Candhis puis republie le site.
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bouées Candhis et anémomètres Météo-France
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: python scripts/fetch_obs.py data/obs.json
      - name: Créneau de 3 h pour la grille de la carte
        id: slot
        run: echo "slot=$(date -u +%Y%m%d)-$(( $(date -u +%H) / 3 ))" >> "$GITHUB_OUTPUT"
      - name: Grille en cache
        id: gridcache
        uses: actions/cache@v4
        with:
          path: data/grid.json
          key: grid-${{ steps.slot.outputs.slot }}
      - name: Grille de la carte (houle MFWAM + vent AROME HD)
        if: steps.gridcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_grid.py data/grid.json
      - name: Créneau de 6 h pour la houle côtière
        id: slot6
        run: echo "slot=$(date -u +%Y%m%d)-$(( $(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - name: Houle côtière en cache
        id: ww3cache
        uses: actions/cache@v4
        with:
          path: |
            data/ww3.json
            data/ww3_spots.json
          key: ww3-${{ steps.slot6.outputs.slot }}
      - name: Houle côtière WaveWatch III Météo-France (1 km)
        if: steps.ww3cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
        run: |
          pip install -q netCDF4 scipy numpy
          python scripts/fetch_ww3.py data
      - name: Archive des mesures (branche archive)
        run: |
          git fetch -q origin archive:archive || true
          if git show-ref --verify --quiet refs/heads/archive; then
            git worktree add -q arch archive
          else
            git worktree add -q --orphan -b archive arch
          fi
          python scripts/archive_obs.py data/obs.json arch/obs
          cd arch
          git add obs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Archive des mesures" || true
          git push -q origin archive || echo "archive non poussée"
      - name: Préparer le site
        run: |
          mkdir -p _site/archive
          cp -r index.html js spots.json data icons manifest.json sw.js .nojekyll _site/
          cp -r arch/obs _site/archive/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

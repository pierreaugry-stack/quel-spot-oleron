name: Telegram - trouver le groupe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node scripts/telegram_chats.mjs
